name: Rectify11

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      NUGET_CERT_REVOCATION_MODE: offline
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        submodules: recursive
        lfs: true

    - name: Place vendored atlcomcli.h where the compiler looks
      shell: pwsh
      run: |
        $targetDirs = @(
          "RectifyControlPanel2\Rectify11CPL",
          "RectifyControlPanel2\dui70\DirectUI"
        )
        foreach ($dir in $targetDirs) {
          if (Test-Path $dir) {
            Copy-Item -Force "vendor\atl\atlcomcli.h" "$dir\atlcomcli.h"
            Write-Host "Copied to $dir"
          }
        }
        # Also drop it in a well-known include location
        New-Item -ItemType Directory -Force -Path "vendor\atl" | Out-Null
        $env:INCLUDE = "$PWD\vendor\atl;$env:INCLUDE"
        echo "INCLUDE=$PWD\vendor\atl;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8"

    - name: Restore NuGet Packages
      run: nuget restore Rectify11Installer.sln

    - name: Build
      shell: cmd
      run: |
        set INCLUDE=%CD%\vendor\atl;%INCLUDE%
        msbuild Rectify11Installer.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal /p:AdditionalIncludeDirectories="%CD%\vendor\atl"

    - name: Publish
      run: dotnet publish Rectify11Installer -c Release -p:PublishProfile=FolderProfile -property:SolutionDir=${{ github.workspace }}\
      continue-on-error: true
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rectify11Installer (x64)
        path: Rectify11Installer\bin\Release\net8.0-windows\publish\win-x64\Rectify11Installer.exe
        compression-level: 0
        if-no-files-found: warn
