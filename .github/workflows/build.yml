name: Rectify11

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      NUGET_CERT_REVOCATION_MODE: offline
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        submodules: recursive
        lfs: true

    - name: Remove atlcomcli.h dependency from source
      shell: pwsh
      run: |
        $header = "RectifyControlPanel2\Rectify11CPL\Rectify11CPL.h"
        if (Test-Path $header) {
          $content = Get-Content $header -Raw
          $content = $content -replace '#include\s*<atlcomcli\.h>\s*', ''
          $content = $content -replace '#include\s*"atlcomcli\.h"\s*', ''
          Set-Content $header $content -NoNewline
          Write-Host "Removed atlcomcli.h include from $header"
        } else {
          Write-Warning "Header not found: $header"
        }

        # Also drop the vendored stub next to the sources as a fallback
        $stub = "vendor\atl\atlcomcli.h"
        if (Test-Path $stub) {
          Copy-Item -Force $stub "RectifyControlPanel2\Rectify11CPL\atlcomcli.h"
          Write-Host "Placed fallback stub"
        }

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8"

    - name: Restore NuGet Packages
      run: nuget restore Rectify11Installer.sln

    - name: Build
      shell: cmd
      run: |
        set INCLUDE=%CD%\vendor\atl;%INCLUDE%
        msbuild Rectify11Installer.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal /p:AdditionalIncludeDirectories="%CD%\vendor\atl"

    - name: Publish
      run: dotnet publish Rectify11Installer -c Release -p:PublishProfile=FolderProfile -property:SolutionDir=${{ github.workspace }}\
      continue-on-error: true
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rectify11Installer (x64)
        path: Rectify11Installer\bin\Release\net8.0-windows\publish\win-x64\Rectify11Installer.exe
        compression-level: 0
        if-no-files-found: warn
